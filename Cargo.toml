[package]
name = "rlgym"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
rlviser-rocketsim = { version = "0.1.0", optional = true }
rocketsim = "0.2.0"

[features]
rlviser = ["dep:rlviser-rocketsim"]

[dev-dependencies]
rand = "0.10.1"

[profile.release]
debug = true
lto = true
